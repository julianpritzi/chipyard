# What `nix develop` sets up in this checkout. Changing it re-runs the setup.

# Optional generators to check out: flags of scripts/init-submodules-no-riscv-tools.sh,
# e.g. "--saturn --cva6", or "--full" for all of them (what plain ./build-setup.sh does).
GENERATORS=""

# Flags for ./build-setup.sh (see ./build-setup.sh --help); submodules come from GENERATORS.
# Remove --skip-firesim / --skip-marshal to also set up FireSim / FireMarshal (large).
SETUP_FLAGS="--skip-firesim --skip-marshal"
